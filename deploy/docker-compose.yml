# MM OS — Postgres + API, one VPS, Coolify-managed.
#
# Build context is the REPO ROOT (see the `context: ..` below) because deploy/Dockerfile
# copies backend/, frontend/, and packages/embed/ as siblings — not the deploy/ folder.
#
# Run from the repo root:
#   cp deploy/.env.example deploy/.env        # fill in real values, never commit it
#   scripts/gen-signing-key.sh                # writes deploy/secrets/mmos_signing_key.pem
#   docker compose -f deploy/docker-compose.yml up -d
#
# Postgres publishes NO port to the host (docs/06-network-security.md: the smaller the
# attack surface, the less there is to misconfigure). Only the `api` service reaches it,
# over the compose-internal network, by service name (`postgres`).

services:
  postgres:
    image: postgres:16.15-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: mmos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      # The bootstrap database. deploy/postgres/init.sql then creates the per-service
      # databases and roles (mmos, servicedesk, itemcode, att) and the itemcode_public
      # read-only role, exactly as docs/05-service-integration.md specifies.
      POSTGRES_DB: mmos
    volumes:
      - mmos_pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    # No `ports:` here — this is the whole point. Nothing outside this compose network
    # can reach Postgres directly, not even from the VPS host's own loopback.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmos -d mmos"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - mmos_internal

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Must resolve to the `postgres` service on this network, not localhost — the
      # default in backend/app/config.py points at localhost for bare-metal dev.
      MMOS_DATABASE_URL: postgresql+psycopg://mmos:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/mmos
    secrets:
      - source: mmos_signing_key
        target: mmos_signing_key.pem
    ports:
      # Coolify's own proxy (Traefik) is what the internet-facing 80/443 terminates on;
      # this host port is what Coolify's proxy or the office reverse path connects to.
      # See deploy/COOLIFY.md for how Coolify wires this up on the VPS.
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - mmos_internal

secrets:
  # Generated by scripts/gen-signing-key.sh into deploy/secrets/ (gitignored — see
  # deploy/.env.example and the repo .gitignore for *.pem). Never committed, never an
  # env var: env vars leak into logs, crash reports and `docker inspect`.
  mmos_signing_key:
    file: ./secrets/mmos_signing_key.pem

volumes:
  mmos_pgdata:
    name: mmos_pgdata

networks:
  mmos_internal:
    name: mmos_internal
