[alembic]
script_location = alembic
prepend_sys_path = .

# sqlalchemy.url is intentionally blank here — env.py sets it at runtime from
# MMOS_DATABASE_URL (via app.config.settings()) so the URL is never duplicated
# or hardcoded outside the one place the rest of the app reads it from.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
