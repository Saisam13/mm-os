# Coolify root deployment for the next controlled MMOS release.
# The explicitly named demo variant is deploy/docker-compose.coolify.yml.
#
# Lives at the repo ROOT on purpose: Coolify runs compose from the repository root, so a
# `context: ..` relative to deploy/ resolved outside the checkout and the deploy failed
# within seconds. Paths here are all root-relative.
#
# This topology preserves existing named database and signing-key volumes.
#
#  * No `secrets:` block. The production compose mounts the RSA signing key as a secret file
#    that is gitignored and therefore absent on a fresh clone, which would fail the deploy.
#    Here MMOS_SIGNING_KEY_PATH points into the existing persistent volume. Production
#    requires that key to exist already; it never silently generates a replacement.
#  * Schema migration is a separate operator step. Startup never seeds demo accounts.
#  * Private access is the default. Reconcile actual ingress, VPN and proxy peer CIDRs
#    before deploying so a configuration change does not lock out legitimate users.
#
# Set in Coolify's environment, not here: POSTGRES_PASSWORD, MMOS_ISSUER, MMOS_COOKIE_DOMAIN.
services:
  postgres:
    image: postgres:16.15-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: mmos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the Coolify environment}
      POSTGRES_DB: mmos
    volumes:
      - mmos_pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmos -d mmos"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVICE_FQDN_API_8000: ${SERVICE_FQDN_API_8000:-}
      MMOS_DATABASE_URL: postgresql+psycopg://mmos:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the Coolify environment}@postgres:5432/mmos
      MMOS_NETWORK_MODE: "${MMOS_NETWORK_MODE:-private}"
      MMOS_ALLOWED_CIDRS: "${MMOS_ALLOWED_CIDRS:-10.8.0.0/24,127.0.0.1/32}"
      MMOS_TRUSTED_PROXY_COUNT: "${MMOS_TRUSTED_PROXY_COUNT:-1}"
      MMOS_TRUSTED_PROXY_CIDRS: "${MMOS_TRUSTED_PROXY_CIDRS:-127.0.0.1/32,::1/128}"
      MMOS_SIGNING_KEY_PATH: /data/mmos_signing_key.pem
      MMOS_SEED_ON_BOOT: "false"
      MMOS_ENVIRONMENT: "production"
      MMOS_VERSION: "${MMOS_VERSION:?set a unique release identifier}"
      MMOS_COOKIE_SECURE: "true"
      MMOS_COOKIE_DOMAIN: "${MMOS_COOKIE_DOMAIN:-}"
      MMOS_ISSUER: "${MMOS_ISSUER:?preserve the current token issuer}"
      MMOS_PUBLIC_URL: "${MMOS_PUBLIC_URL:?set the actual HTTPS MMOS website origin}"
    volumes:
      - mmos_keydata:/data
    # Migrate the backed-up database before replacing the API container. Startup does
    # not mutate schema or registry records. The image entrypoint drops root privileges.
    command:
      - sh
      - -c
      - |
        set -eu
        export MMOS_MIGRATE_ON_BOOT=false
        export MMOS_SEED_ON_BOOT=false
        exec /app/entrypoint.sh
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mmos_pgdata:
  mmos_keydata:
